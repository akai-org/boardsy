name: "CI - split: lint, generate"

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint + pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint (eslint)
        run: npm run lint

      - name: Run pre-commit (lint-staged)
        run: npx lint-staged --allow-empty --verbose --no-stash

  generate:
    name: prisma:generate
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate (produce client binaries)
        run: npx prisma generate

  done-notify:
    name: done
    runs-on: ubuntu-latest
    needs: [generate]
    steps:
      - name: Done
        run: echo "CI finished."
