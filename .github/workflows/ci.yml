name: "CI - split: lint, generate, build, migrate, push"

on:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: lint + pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run lint (eslint)
        run: npm run lint

      - name: Run pre-commit (lint-staged)
        # lint-staged expects staged files; --allow-empty prevents failure when none are staged in CI
        run: npx lint-staged --allow-empty --verbose

  generate:
    name: prisma:generate
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate (produce client binaries)
        run: npx prisma generate

  migrate:
    name: "optional: prisma migrate deploy"
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.DATABASE_URL }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy

  done-notify:
    name: done
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Done
        run: echo "CI finished."
